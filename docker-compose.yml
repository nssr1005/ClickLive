version: '3.8'

services:
  # 1. The PostgreSQL Database Node
  db:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: analytics
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  # 2. The Redis Message Broker Node
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  # 3. The FastAPI Web App Node
  web:
    build: .
    command: uvicorn main:app --host 0.0.0.0 --port 8000 --reload
    ports:
      - "8000:8000"
    environment:
      - REDIS_HOST=redis
      - DATABASE_URL=postgresql://postgres:password@db:5432/analytics
    depends_on:
      - db
      - redis

  # 4. The Python Background Worker Node
  worker:
    build: .
    command: python worker.py
    environment:
      - REDIS_HOST=redis
      - DATABASE_URL=postgresql://postgres:password@db:5432/analytics
    depends_on:
      - db
      - redis

volumes:
  postgres_data: